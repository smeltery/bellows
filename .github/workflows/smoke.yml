name: Smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to smoke test
        required: false
  release:
    types: [published]

permissions:
  contents: read

jobs:
  go-install:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || 'latest' }}
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install Bellows with Go
        run: GOPROXY=direct go install github.com/smeltery/bellows@"$TAG"

      - name: Check installed binary
        run: |
          bellows --version
          bellows --help

  go-install-private-mode:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      GOPRIVATE: github.com/smeltery/*
      GONOSUMDB: github.com/smeltery/*
      TAG: ${{ github.event.release.tag_name || inputs.tag || 'latest' }}
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install Bellows with private module settings
        run: GOPROXY=direct go install github.com/smeltery/bellows@"$TAG"

      - name: Check installed binary
        run: bellows --version

  homebrew-install:
    timeout-minutes: 15
    runs-on: macos-latest
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag || 'latest' }}
    steps:
      - name: Install Bellows from Homebrew
        run: |
          brew tap smeltery/tap
          brew install --cask smeltery/tap/bellows
          brew audit --cask smeltery/tap/bellows --online

      - name: Check installed binary
        run: |
          VERSION_OUTPUT="$(bellows --version)"
          echo "$VERSION_OUTPUT"
          if [ "$TAG" != "latest" ]; then
            test "$VERSION_OUTPUT" = "bellows version ${TAG#v}"
          fi
          bellows --help

  release-archive:
    if: github.event_name == 'release' || inputs.tag != ''
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Download release artifacts
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "bellows_linux_amd64.tar.gz" --pattern "checksums.txt" --dir dist

      - name: Check archive binary
        run: |
          (cd dist && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf dist/bellows_linux_amd64.tar.gz -C dist
          dist/bellows --version
          dist/bellows --help
