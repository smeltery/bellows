name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: flox/install-flox-action@61d86f71ca9fc8061fea04e5bc5e3a8206423dca
      - uses: flox/activate-action@6abc249840d01f0c59473f21ba74821564d320b7
        with:
          command: make release-check
      - uses: actions/upload-artifact@v6
        continue-on-error: true
        if: ${{ env.ACT != 'true' }}
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          if-no-files-found: error
