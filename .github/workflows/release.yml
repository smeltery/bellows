name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: flox/install-flox-action@61d86f71ca9fc8061fea04e5bc5e3a8206423dca
      - uses: flox/activate-action@6abc249840d01f0c59473f21ba74821564d320b7
        with:
          command: make check
      - uses: flox/activate-action@6abc249840d01f0c59473f21ba74821564d320b7
        with:
          command: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Dispatch installation smoke tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run smoke.yml --ref main -f tag="$RELEASE_TAG"
