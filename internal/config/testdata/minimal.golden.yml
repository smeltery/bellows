version: 1
default_workflows:
    - ci.yml
event: pull_request
docker:
    pull: missing
runner:
    map:
        blacksmith-4vcpu-ubuntu-2404: catthehacker/ubuntu:act-24.04
        ubuntu-latest: catthehacker/ubuntu:act-22.04
secrets:
    mode: none
skip:
    jobs:
        - deploy
precommit:
    stage: pre-push
    mode: full
    timeout_seconds: 900
