version: 1
default_workflows:
    - ci.yml
event: pull_request
docker:
    pull: missing
runner:
    map:
        blacksmith-4vcpu-ubuntu-2404: ghcr.io/smeltery/kiln:ubuntu-24.04
        ubuntu-latest: ghcr.io/smeltery/kiln:ubuntu-22.04
secrets:
    mode: none
skip:
    jobs:
        - deploy
precommit:
    stage: pre-push
    mode: full
    timeout_seconds: 900
