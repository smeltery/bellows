name: CI

on:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, blacksmith-4vcpu-ubuntu-2404]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: go test ./...

  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
      - uses: actions/upload-artifact@v5
